name: Synthetic SSH socket compatibility
on:
  workflow_dispatch:
  pull_request:
    paths:
      - tests/ssh-socket-probe/**
      - .github/workflows/ssh-socket-compatibility.yml
permissions:
  contents: read
concurrency:
  group: ssh-socket-probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fixtures:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: node --test tests/ssh-socket-probe/fixture.test.mjs
      - name: Build and save synthetic fixtures once
        run: |
          docker build --pull -t ssh-socket-api:fixture -f tests/ssh-socket-probe/api.Dockerfile .
          docker build --pull -t ssh-socket-web:fixture -f tests/ssh-socket-probe/web.Dockerfile .
          mkdir -p "$RUNNER_TEMP/ssh-socket-input"
          docker save --output "$RUNNER_TEMP/ssh-socket-input/fixtures.tar" ssh-socket-api:fixture ssh-socket-web:fixture
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ssh-socket-input'
          tags = ['ssh-socket-api:fixture', 'ssh-socket-web:fixture']
          data = {'images': {tag: json.loads(subprocess.check_output(['docker','image','inspect',tag]))[0]['Id'] for tag in tags},
                  'archiveSha256': hashlib.sha256((root / 'fixtures.tar').read_bytes()).hexdigest(),
                  'builder': json.loads(subprocess.check_output(['docker','version','--format','{{json .}}'])),
                  'baseTags': ['node:24-bookworm-slim', 'nginxinc/nginx-unprivileged:1.28-alpine']}
          (root / 'fixtures.json').write_text(json.dumps(data, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ssh-socket-fixtures
          path: ${{ runner.temp }}/ssh-socket-input/
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
  linux-end-to-end:
    needs: fixtures
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ssh-socket-fixtures
          path: ${{ runner.temp }}/ssh-socket-input
      - name: Real Linux SSH and upstream Docker 20.10.24 on a separate hosted VM
        run: |
          sudo env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" RUNNER_TEMP="$RUNNER_TEMP" SSH_PROBE_USER="$(id -un)" bash tests/ssh-socket-probe/run-hosted.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ssh-socket-linux-proof
          path: ${{ runner.temp }}/ssh-socket-proof/
          retention-days: 7
          if-no-files-found: warn
  windows-client-protocol:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned loopback SSH protocol fixture
        run: python -m pip install -r tests/ssh-socket-probe/requirements.lock
      - name: Verify protocol fixture catches host-key and path regressions
        run: python tests/ssh-socket-probe/windows-probe.test.py
      - name: Stock Windows ssh.exe TCP-to-remote-Unix protocol and HTTP assertion
        if: ${{ !cancelled() }}
        run: python tests/ssh-socket-probe/run-windows.py --output "$env:RUNNER_TEMP/ssh-socket-windows.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ssh-socket-windows-protocol-proof
          path: ${{ runner.temp }}/ssh-socket-windows.json
          retention-days: 7
          if-no-files-found: warn
