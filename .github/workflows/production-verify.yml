name: Production architecture verification
on:
  push:
    branches: [main, feat/comprehensive-oracle]
  pull_request:
    paths: ['apps/**', 'packages/**', 'compose*.yml', 'infra/**', 'tests/**', 'package*.json', 'scripts/**', '.github/workflows/production-verify.yml']
permissions:
  contents: read
concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: integration-root-password
          MYSQL_DATABASE: star_oracle
          MYSQL_USER: oracle
          MYSQL_PASSWORD: integration-db-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pintegration-root-password"
          --health-interval=10s --health-timeout=5s --health-retries=15
      redis:
        image: redis:7.4
        ports: ['6379:6379']
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=3s --health-retries=10
    env:
      NODE_ENV: test
      PORT: 3111
      WEB_ORIGIN: http://localhost:5173
      API_PUBLIC_URL: http://localhost:5173
      DATABASE_URL: mysql://oracle:integration-db-password@127.0.0.1:3306/star_oracle
      REDIS_URL: redis://127.0.0.1:6379
      AUTH_SECRET: integration-test-secret-12345678901234567890
      DATA_ENCRYPTION_KEY: 1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef
      ADMIN_REQUIRE_2FA: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate -w @star-oracle/api
      - name: Verify committed migrations match the Prisma schema
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel apps/api/prisma/schema.prisma --exit-code
      - name: Inspect dependency advisories
        run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run build
      - name: Create local TLS fixture for model contract tests
        run: |
          mkdir -p /tmp/star-oracle-tls
          openssl req -x509 -newkey rsa:2048 -nodes -keyout /tmp/star-oracle-tls/key.pem -out /tmp/star-oracle-tls/cert.pem -days 1 -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost' >/dev/null 2>&1
      - run: npm test
        env:
          AI_API_KEY: integration-model-fixture
          AI_BASE_URL: https://localhost:3443/v1
          AI_DAILY_LIMIT: '3'
          NODE_EXTRA_CA_CERTS: /tmp/star-oracle-tls/cert.pem
          MOCK_TLS_CERT: /tmp/star-oracle-tls/cert.pem
          MOCK_TLS_KEY: /tmp/star-oracle-tls/key.pem
      - name: Checkout fixed performance baseline
        if: github.event_name == 'push'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: a639057e9884efb53fb712d7a41b0d16e8cbf0c3
          path: .performance-baseline
          persist-credentials: false
      - name: Install baseline dependencies and Prisma client
        if: github.event_name == 'push'
        working-directory: .performance-baseline
        run: |
          npm ci --include=dev
          npm run db:generate
      - name: Build baseline web in production mode
        if: github.event_name == 'push'
        working-directory: .performance-baseline
        env:
          NODE_ENV: production
        run: npm exec --workspace @star-oracle/web -- vite build --manifest
      - name: Build optimized web in production mode
        if: github.event_name == 'push'
        env:
          NODE_ENV: production
        run: npm exec --workspace @star-oracle/web -- vite build --manifest --outDir "$RUNNER_TEMP/star-oracle-web-production"
      - name: Compare initial production assets with baseline
        if: github.event_name == 'push'
        env:
          PERFORMANCE_BASELINE_DIR: ${{ github.workspace }}/.performance-baseline
          PERFORMANCE_WEB_DIST: ${{ runner.temp }}/star-oracle-web-production
        run: node scripts/compare-web-performance.mjs
      - name: Compare domain calculations and time formatter reuse
        if: github.event_name == 'push'
        env:
          PERFORMANCE_BASELINE_DIR: ${{ github.workspace }}/.performance-baseline
        run: node scripts/compare-domain-performance.mjs
      - name: Compare API work and response compatibility
        if: github.event_name == 'push'
        env:
          PERFORMANCE_BASELINE_DIR: ${{ github.workspace }}/.performance-baseline
        run: node scripts/compare-api-performance.mjs
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install --with-deps chromium webkit
      - name: Reset only ephemeral integration Redis before browser accounts
        run: node --input-type=module -e 'import {Redis} from "ioredis"; const client=new Redis(process.env.REDIS_URL); await client.flushdb(); client.disconnect();'
      - run: npm run test:e2e
        env:
          CI_VISUAL_REVIEW: 'true'
          CI_REVIEW_DETAIL: 'true'
          CI_VISUAL_REVIEW_DETAIL: 'true'
      - name: Verify formal SSH HTTP sessions in real browsers
        run: |
          ssh_redis_password="$(openssl rand -hex 32)"
          echo "::add-mask::$ssh_redis_password"
          docker run -d --name star-oracle-ssh-browser-redis --publish 127.0.0.1:6380:6379 redis:7.4 redis-server --requirepass "$ssh_redis_password"
          trap 'docker rm -f star-oracle-ssh-browser-redis >/dev/null' EXIT
          for attempt in $(seq 1 30); do
            if docker exec -e REDISCLI_AUTH="$ssh_redis_password" star-oracle-ssh-browser-redis redis-cli ping | grep -q PONG; then break; fi
            sleep 1
          done
          NODE_ENV=test REDIS_URL="redis://:$ssh_redis_password@127.0.0.1:6380" npx playwright test -c tests/e2e/playwright.ssh.config.ts
      - name: Validate production Docker builds and isolated stack
        if: ${{ !cancelled() }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y age
          bash scripts/container-smoke.sh
      - name: Verify actual SSH Docker routing and cookie boundaries
        run: node scripts/ssh-container-smoke.mjs --proof "$RUNNER_TEMP/ssh-verified-images.json"
      - name: Export exact verified images and offline SSH deployment bundle
        if: success()
        run: node scripts/ssh-release.mjs pack "$RUNNER_TEMP/star-oracle-ssh" --proof "$RUNNER_TEMP/ssh-verified-images.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: star-oracle-ssh-linux-amd64-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/star-oracle-ssh/
          include-hidden-files: true
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Record verified revision
        if: always()
        run: git rev-parse HEAD > verified-revision.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: production-review
          path: |
            verified-revision.txt
            test-results/
            playwright-report/
            apps/web/dist/
            apps/api/prisma/migrations/
            performance-results/
          retention-days: 14
