name: Refresh pinned dependency lock
on:
  push:
    branches: [feat/production-architecture]
    paths: ['package.json', '.github/workflows/refresh-lock.yml']
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit only the generated dependency lock
        run: |
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name "Star Oracle build"
            git config user.email "noreply@users.noreply.github.com"
            git commit -m "build: pin current Playwright test engine"
            git push origin HEAD:${{ github.ref_name }}
          fi
