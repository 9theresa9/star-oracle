name: Verify MVP
on:
  push:
    branches: [main, feat/star-oracle-mvp]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and core/API tests
        run: |
          node --check public/app.js
          node --check server/index.js
          npm test
      - name: Build Sites Worker
        run: |
          npm run build
          npm run preview:build
          node --check dist/server/index.js
          node tests/worker-smoke.mjs
      - name: Install browser test tools
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Desktop and iPhone-size UI smoke tests
        run: npm run test:browser
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: artifacts/screenshots/
          if-no-files-found: ignore
      - name: Upload standalone preview
        uses: actions/upload-artifact@v4
        with:
          name: interactive-preview
          path: artifacts/preview.html
      - name: Upload Sites build
        uses: actions/upload-artifact@v4
        with:
          name: sites-worker-build
          path: dist/
          include-hidden-files: true
