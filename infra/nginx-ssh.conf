# Standalone nginx config, used only by compose.ssh.yml.
pid /tmp/nginx.pid;
worker_processes auto;
error_log /dev/null;
events { worker_connections 512; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  log_format privacy escape=json '{"time":"$time_iso8601","request_id":"$request_id","status":$status,"bytes":$body_bytes_sent,"duration":$request_time}';
  map $request_uri $loggable_request {
    default 1;
    ~*^/(account|api)(/|\?|$) 0;
  }
  map $http_host $valid_authority { default 0; ~^localhost:17777$ 1; }
  map $http_origin $valid_origin { default 0; '' 1; ~^http://localhost:17777$ 1; }
  map "$http_forwarded$http_x_forwarded_for$http_x_forwarded_host$http_x_forwarded_proto$http_x_forwarded_port$http_x_forwarded_server$http_x_forwarded_prefix$http_x_forwarded_ssl$http_x_real_ip" $has_proxy_headers { default 1; '' 0; }
  map $request $origin_form { default 0; "~^[A-Z]+ /[^ ]* HTTP/[0-9.]+$" 1; }
  server {
    listen 8080;
    server_name localhost;
    server_tokens off;
    access_log /dev/stdout privacy if=$loggable_request;
    error_log /dev/null;
    # Host publication arrives from this bridge gateway. Routed packets from
    # another host/container must not become a second entrance to the service.
    allow 172.30.77.1;
    allow 127.0.0.1;
    deny all;
    if ($origin_form = 0) { return 400; }
    if ($valid_authority = 0) { return 421; }
    if ($host != localhost) { return 421; }
    if ($valid_origin = 0) { return 403; }
    if ($has_proxy_headers = 1) { return 403; }
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; object-src 'none'; worker-src 'self'; manifest-src 'self'" always;
    location /api/ {
      proxy_pass http://172.30.77.2:3001;
      proxy_http_version 1.1;
      proxy_set_header Host localhost:17777;
      # Forward incoming proxy headers unchanged, including empty values, so
      # the API can reject every Forwarded/X-Forwarded-*/X-Real-IP occurrence.
      # This proxy never creates or trusts those headers.
      proxy_set_header Connection "";
      proxy_connect_timeout 5s;
      proxy_read_timeout 120s;
      proxy_buffering off;
    }
    location = /sw.js { expires -1; try_files $uri =404; }
    location = /manifest.webmanifest { default_type application/manifest+json; expires -1; try_files $uri =404; }
    location /assets/ { expires 1y; try_files $uri =404; }
    location / { expires -1; try_files $uri $uri/ /index.html; }
  }
}
