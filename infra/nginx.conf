# This file is included inside nginx's http context. Never inherit the image's
# combined format: it contains the full request and Referer (including tokens).
log_format privacy escape=json '{"time":"$time_iso8601","request_id":"$request_id","status":$status,"bytes":$body_bytes_sent,"duration":$request_time}';
# Use the original URI so SPA internal redirects cannot turn logging back on.
map $request_uri $loggable_request {
  default 1;
  ~*^/(account|api)(/|\?|$) 0;
}

server {
  listen 8080;
  server_name _;
  server_tokens off;
  access_log /dev/stdout privacy if=$loggable_request;
  # Nginx error logs cannot be formatted/redacted and may include raw requests.
  # Use health/status metrics and nginx -t for diagnostics, not request error logs.
  error_log /dev/null;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; object-src 'none'; worker-src 'self'; manifest-src 'self'" always;
  location = /sw.js {
    expires -1;
    try_files $uri =404;
  }
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    expires -1;
    try_files $uri =404;
  }
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }
  location / {
    expires -1;
    try_files $uri $uri/ /index.html;
  }
}
